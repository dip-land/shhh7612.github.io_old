<!DOCTYPE html>
<html lang="en">

        <meta charset="UTF-8">

        <style>
            body {
                background: white !important;
                box-shadow: none !important;
            }
            #videoContainer {
                text-align: center;
                background: black;
                position: relative;
                width: 768px;
                height: 432px;
            } 
            @media screen and (max-width:520px) {
                #videoContainer {
                    width: 100vw;
                }
            }
            #videoContainer #controls {
                background: rgb(0,0,0);
                background: linear-gradient(0deg, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
                display: grid;
                grid-template-rows: auto auto;
                grid-template-columns: max-content max-content auto max-content;
                left: 0;
                right: 0;
                bottom: 0;
                position: absolute;
                z-index: 200;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-transition: all ease-in-out 0.20s;
                -o-transition: all ease-in-out 0.20s;
                transition: all ease-in-out 0.20s;
            }
            video {
                position: relative;
                height: 100%;
            }
            #seekbar {  
                cursor: pointer;
                height: 10px;
                margin-bottom: 10px;
                outline: 1px solid rgb(255, 255, 255);
                overflow: hidden;
                position: relative;
                top: 22px;
            }
            #videoTime {
                font-weight: 700;
                font-size: 16px;
                text-align: center;
                padding: 14px 16px;
            }
            #seekbar span {
                background-color: rgb(255, 255, 255);
                position: absolute;
                top: 0;
                left: 0;
                height: 10px;
                width: 0px;
                -webkit-transition: all ease-in-out 0.5s;
                -o-transition: all ease-in-out 0.5s;
                transition: all ease-in-out 0.5s;
            }
            #buffered {
                background-color: rgba(255, 255, 255, 0.25) !important;
            }
            button {
                font-size: 16px;
                background: none !important;
                color: var(--buttonText) !important;
                text-align: center;
                padding: 14px 16px;
            }
            button:hover {
                background: none !important;
                color: var(--primaryText) !important;
            }
        </style>
    </head>
    <body>
        <div id="videoContainer">
            <div id="controls">
                <button onclick="playPause()"><i class="fas fa-play"></i></button> 
                <span id="videoTime"></span>
                <div id="seekbar">
                    <span></span>
                    <span id="buffered"></span>
                </div>
                <button onclick="fullscreen()"><i class="fas fa-expand-alt"></i></button>
            </div>
            <video onclick="playPause()" oncontextmenu="return false;">
                <source src="./videos/sample_1280x720_surfing_with_audio.mp4" type="video/mp4">
                I'm sorry; your browser doesn't support HTML5 video.
            </video>
        </div>
        <script> 
            function getOS() {
                let userAgent = window.navigator.userAgent;
                let platform = window.navigator.platform;
                let macosPlatforms = ['Macintosh', 'MacIntel', 'MacPPC', 'Mac68K'];
                let windowsPlatforms = ['Win32', 'Win64', 'Windows', 'WinCE'];
                let iosPlatforms = ['iPhone', 'iPad', 'iPod'];
                let os = null;
                if (macosPlatforms.indexOf(platform) !== -1) {
                    os = 'Mac OS';
                } else if (iosPlatforms.indexOf(platform) !== -1) {
                    os = 'iOS';
                } else if (windowsPlatforms.indexOf(platform) !== -1) {
                    os = 'Windows';
                } else if (/Android/.test(userAgent)) {
                    os = 'Android';
                } else if (!os && /Linux/.test(platform)) {
                    os = 'Linux';
                }
                return os;
            }
            let video = document.getElementsByTagName('VIDEO').item(0); 
            let seekbar = document.getElementById('seekbar');
            let videoTime = document.getElementById('videoTime');
            let container = video.parentElement;
            let controls = seekbar.parentElement;
            let playButton = controls.children[0];
            let fullscreenButton = controls.children[3].children[0];
            let timeout;
            let duration = 2500;
            if(getOS() === 'Mac OS' || getOS() === 'iOS'){
                controls.remove();
                video.setAttribute('controls', 'true');
            } else {
                container.addEventListener('dblclick', function (e) {
                    if(isVideoInFullscreen()) {
                        document.exitFullscreen();
                    } else {
                        container.requestFullscreen();
                    }
                });
                video.removeAttribute("controls");
                video.addEventListener("mouseover", function (event) {
                    document.addEventListener('mousemove', function() {
                        playButton.focus();
                        controls.style.opacity = "1";
                        video.style.cursor = "initial";
                        clearTimeout(timeout);
                        timeout = setTimeout(function() {
                            if(isVideoInFullscreen()){
                                controls.style.opacity = "0";
                            }
                            video.style.cursor = "none";
                        }, duration)
                    });
                }, false);
                window.addEventListener(`load`, ()=>{
                    try{
                        videoTime.innerHTML = `${format(0)} / ${format(video.duration)}`;
                    }catch(e){
                        try{
                            videoTime.innerHTML = `${format(0)} / ${format(video.duration)}`;
                        }catch(e){
                            setTimeout(()=>{
                                videoTime.innerHTML = `${format(0)} / ${format(video.duration)}`;
                            }, 500)
                        }
                    }
                })

                video.ontimeupdate = function(){
                    let percentage = ( video.currentTime / video.duration ) * 100;
                    let buffPercent = ( video.buffered.end(video.buffered.length - 1) / video.duration ) * 100;
                    seekbar.children[0].style.width = percentage + "%";
                    seekbar.children[1].style.width = buffPercent + "%";
                    videoTime.innerHTML = `${format(video.currentTime)} / ${format(video.duration)}`;
                };

                seekbar.addEventListener('click', function(click) {
                    let left = click.pageX - seekbar.offsetLeft;
                    let totalWidth = seekbar.offsetWidth;
                    let percentage = left / totalWidth;
                    let vidTime = video.duration * percentage;
                    video.currentTime = vidTime;
                })
                video.addEventListener('ended', end=>{
                    playButton.children[0].classList.replace('fa-pause', 'fa-redo-alt');
                });
            }

            function format(num) {
                return new Date(Math.round(num) * 1000).toISOString().substr(11, 8);
            }
            function playPause() { 
                playButton.focus();
                if(video.paused) {
                    video.play();
                    if(playButton.children[0].classList.contains('fa-redo-alt')){
                        playButton.children[0].classList.replace('fa-redo-alt', 'fa-pause');
                    } else {
                        playButton.children[0].classList.replace('fa-play', 'fa-pause');
                    }
                } else {
                    video.pause();
                    playButton.children[0].classList.replace('fa-pause', 'fa-play'); 
                }
            }

            function fullscreen() {
                playButton.focus();
                if(isVideoInFullscreen()){
                    fullscreenButton.classList.replace('fa-compress-alt', 'fa-expand-alt');
                    document.exitFullscreen();
                } else {
                    fullscreenButton.classList.replace('fa-expand-alt', 'fa-compress-alt');
                    container.requestFullscreen();
                }
            }

            function isVideoInFullscreen() {
                if (document.fullscreenElement && document.fullscreenElement.children[1].nodeName == 'VIDEO') {
                    return true;
                }
                return false;
            }
        </script> 
        <script src="script.js"></script>
    </body>
</html>
